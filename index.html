<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404FRIEND</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- ==================== ГЛАВНАЯ ==================== -->

    <section id="home" class="page">

        <header>
            <h1>404FRIEND</h1>

            <nav>
                <a href="/">Главная</a>
                <a href="/login">Войти</a>
                <a href="/pricing">Тарифы</a>
            </nav>
        </header>


        <main>

            <h2>Твой AI-друг</h2>

            <div class="plan">
                <strong>Free</strong>

                <span id="usage">
                    0 / 50 сообщений
                </span>
            </div>


            <div class="chat">

                <div id="response" class="response"></div>

                <textarea
                    id="message"
                    placeholder="Напиши сообщение..."
                    rows="4"
                ></textarea>

                <button id="send">
                    Отправить
                </button>

            </div>

        </main>

    </section>


    <!-- ==================== ВХОД ==================== -->

    <section
        id="login"
        class="page"
        style="display: none;"
    >

        <header>
            <h1>404FRIEND</h1>

            <nav>
                <a href="/">Главная</a>
                <a href="/pricing">Тарифы</a>
            </nav>
        </header>


        <main>

            <h2>Войти</h2>

            <form id="loginForm">

                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Пароль"
                    required
                >

                <button type="submit">
                    Войти
                </button>

            </form>

            <p id="loginMessage"></p>

        </main>

    </section>


    <!-- ==================== ТАРИФЫ ==================== -->

    <section
        id="pricing"
        class="page"
        style="display: none;"
    >

        <header>
            <h1>404FRIEND</h1>

            <nav>
                <a href="/">Главная</a>
                <a href="/login">Войти</a>
            </nav>
        </header>


        <main>

            <h2>Тарифы</h2>


            <div class="plans">

                <!-- FREE -->

                <div class="plan-card">

                    <h3>Free</h3>

                    <p>
                        50 сообщений
                    </p>

                    <button>
                        Текущий тариф
                    </button>

                </div>


                <!-- PRO -->

                <div class="plan-card">

                    <h3>Pro</h3>

                    <p>
                        150 сообщений
                    </p>

                    <button>
                        Pro
                    </button>

                </div>


                <!-- EXTRA 1 -->

                <div class="plan-card">

                    <h3>Extra 1</h3>

                    <p>
                        +50 сообщений
                    </p>

                    <button>
                        Extra 1
                    </button>

                </div>


                <!-- EXTRA 2 -->

                <div class="plan-card">

                    <h3>Extra 2</h3>

                    <p>
                        +100 сообщений
                    </p>

                    <button>
                        Extra 2
                    </button>

                </div>

            </div>

        </main>

    </section>


    <!-- ==================== JAVASCRIPT ==================== -->

    <script src="/app.js"></script>


    <script>

        const sendButton =
            document.getElementById("send");

        const messageInput =
            document.getElementById("message");

        const responseBox =
            document.getElementById("response");


        if (sendButton) {

            sendButton.addEventListener(
                "click",
                async () => {

                    const message =
                        messageInput.value.trim();

                    if (!message) {
                        return;
                    }


                    sendButton.disabled = true;

                    sendButton.textContent =
                        "Отправка...";


                    try {

                        const reply =
                            await sendMessage(message);


                        if (reply) {

                            responseBox.textContent =
                                reply;

                            messageInput.value = "";

                        }

                    } catch (error) {

                        console.error(error);

                        responseBox.textContent =
                            "Ошибка соединения.";

                    }


                    sendButton.disabled = false;

                    sendButton.textContent =
                        "Отправить";

                }
            );

        }


        const loginForm =
            document.getElementById("loginForm");


        if (loginForm) {

            loginForm.addEventListener(
                "submit",
                (event) => {

                    event.preventDefault();

                    const loginMessage =
                        document.getElementById(
                            "loginMessage"
                        );

                    loginMessage.textContent =
                        "Вход пока не подключён.";

                }
            );

        }

    </script>

</body>
</html>
